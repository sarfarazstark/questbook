# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Loom (and MC 26.2) require a Java 25 toolchain. JAVA_HOME may point at an
# older JDK, so pin the Gradle JVM explicitly. Adjust the path if your JDK lives elsewhere.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-25.0.4.101-hotspot

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
version=0.1.0
maven_group=com.questbook
archives_base_name=questbook

# Dependencies
fabric_api_version=0.161.0+26.2

# Cloth Config, for the in-game config screen. Version line matches MC 26.2.
# Verified against the published fabric.mod.json: requires minecraft >=26.2-
cloth_config_version=26.2.155
