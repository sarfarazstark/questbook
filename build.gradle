plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"questbook" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

loom.runs {
	server {
		runDir "run/server"
	}
	client {
		runDir "run/client"
		programArgs "--username", (project.findProperty("clientUser") ?: "DevTester")
		programArgs "--quickPlayMultiplayer", "localhost:25565"
	}
	client2 {
		inherit client
		runDir "run/client2"
		programArgs "--username", "Alex"
		programArgs "--quickPlayMultiplayer", "localhost:25565"
	}
}

repositories {
	// Cloth Config lives on shedaniel's maven, not Maven Central.
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Config screen builder. Ships with the mod (see fabric.mod.json `depends`),
	// so the config screen works with or without ModMenu installed.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Runs the model self-check with the Minecraft classpath available.
tasks.register('runModelCheck', JavaExec) {
	group = 'verification'
	description = 'Runs QuestModelCheck against the compiled model classes.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.questbook.data.QuestModelCheck'
	dependsOn 'classes'
}

